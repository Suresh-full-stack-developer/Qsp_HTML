<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form</title>
</head>
<body>
    <form action="./Task2.html" method="get">
        <fieldset>
            <legend>Login Form</legend>
            <label for="un">User Name:</label>
            <input type="text" id="un" name="UserName" required placeholder="Enter UserName" minlength="2" maxlength="8"/>
            <br> <br>
            <label for="pwd">Password:</label>
            <input type="password" id="pwd" name="Password" minlength="2" maxlength="5" required placeholder="Enter the Password"/>

            <br> <br>

            <label for="">Age:</label>
            <input type="number" placeholder="Enter your age">

            <br><br>

            <label for="">E-Mail:</label>
            <input type="email" placeholder="Enter e-mail here">
            <br><br>
            <label for="">Mobile Number</label>
            <input type="tel" placeholder="Enter the Mobile Number">
            <br><br>
            <label for="">Gender</label>
            <select name="" id="">
                <option value=""></option>
                <option value="">Male</option>
                <option value="">Female</option>
                <option value="">Others</option>
            </select>
            <br> <br>
            <label for=""> Select Your Fav Movie</label>
            <select name="" id="">
                <optgroup label="Vijay">
                <option value=""></option>
                <option value="begil">Bigil</option>
                <option value="theri">Theri</option>
                <option value="ghilli">Ghilli</option>
                <option value="Jana nayagan">Jana nayagan</option>
                </optgroup>
                <optgroup label="Ajith">
                    <option value="">GBU</option>
                    <option value="">Billa</option>
                    <option value="">Mankatha</option>
                    <option value="">Vivegam</option>
                </optgroup>
            </select>

            <br>
            <br>

            <label for="">Languages Known:</label>
            <label for="">Tamil</label>
            <input type="checkbox">

            <label for="">English</label>
            <input type="checkbox">

            <label for="">Hindi</label>
            <input type="checkbox">

            <label for="">Telugu</label>
            <input type="checkbox">
            <br><br>


            <label for="">Eligible to drive:</label>
            <label for="">Greater than 18</label>
            <input type="radio" name="bike">

             <label for="">Lesser than 18</label>
            <input type="radio" name="bike">

            <br> <br>

            <label for="">Joining date:</label>
            <input type="date">
            <br><br>

            <label for="">Exit time:</label>
            <input type="time">
            <br><br>

            <label for="">Date with time:</label>
            <input type="datetime-local">
            <br><br>
            
            <label for="">Joing month:</label>
            <input type="month">
            <br><br>

            <label for="">Joing Week:</label>
            <input type="week">
            <br><br>


            <label for="">Select Colour:</label>
            <input type="color" name="Colour">
            <br><br>

            <label for="">Select Range:</label>
            <input type="range" name="Range">
            <br><br>

            <label for="">Select the File:</label>
            <input type="file" multiple accept=".pdf,.png">
            <br><br>

            <label for="">Search:</label>
            <input type="search" placeholder="Type to search">
            <br><br>

            <input type="Submit">
            <input type="Reset">
        

        </fieldset>
    </form>
</body>
</html>
